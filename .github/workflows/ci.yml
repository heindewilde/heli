name: CI

# Nothing verified either half of this repo before it deployed. `fly-deploy.yml`
# pushes straight from `main` and `docker.yml` only fires on a tag, so a broken
# `npm run check` reached production and the extension was never type-checked at
# all — esbuild strips types without looking at them, the root tsconfig excludes
# `extension/`, and svelte-check runs off `.svelte-kit/tsconfig.json`, which only
# sees `src/` and `tests/`.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's node:22-alpine and package.json engines.
          node-version: 22
          cache: npm
      - run: npm ci
      # svelte-check, check-tenancy, check-overlays and vitest, in one command.
      - run: npm run check

  # `npm run check` is server-side only — it calls helpers and handlers, never a
  # component. That gap let a real bug ship: a ticked row rendered as unticked,
  # because cancelling a checkbox click makes the browser restore
  # `input.checked` after every handler has run. Six hundred passing tests could
  # not see it. Its own job, like Extension and Mobile, because it needs a build
  # and a browser and has no business slowing a type check down.
  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium only — the suite pins app behaviour, not cross-browser rendering.
      - run: npx playwright install --with-deps chromium
      # The specs boot `build/index.js`: the hydration failures this exists to
      # catch appear only in a built app, never under `vite dev`.
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  extension:
    name: Extension
    runs-on: ubuntu-latest
    # A separate job with its own install, because the extension is deliberately
    # not an npm workspace: making the app's `npm ci` pull these dependencies is
    # exactly what the three isolation guards (.dockerignore, tsconfig exclude,
    # svelte-check's include) exist to prevent.
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The build reaches outside extension/ for the app's icon source and
      # app.css palette, so it also proves those paths still resolve.
      - run: npm run build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    # Its own install, for the same reason as the extension job and more so:
    # Expo's dependency tree is an order of magnitude larger than esbuild's, so
    # hoisting it into the root node_modules would put react and react-native
    # into the closure `adapter-node` externalises against and
    # `scripts/check-budget.ts` measures.
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Reaches into ../src/app.css, so it proves that path still resolves and
      # that every value there is one React Native can parse — the script throws
      # on an unconvertible colour or an unimplemented shadow role.
      - run: npm run tokens
      - run: npx tsc --noEmit
      # The real guard. Metro is configured to see ../src/lib while the repo
      # root's node_modules is blocked, and only a bundle proves both: a shared
      # module that grows a dependency, or a package that silently resolved out
      # of the app's closure on someone's laptop, fails here and nowhere else.
      - run: npx expo export --platform ios --no-bytecode --output-dir /tmp/expo-ci
