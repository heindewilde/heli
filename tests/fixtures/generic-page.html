  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","url":"https://stripe.com/nl/pricing","mainEntity":[{"@type":"Question","name":"Hoe worden kosten voor betalingen berekend?","acceptedAnswer":{"@type":"Answer","text":"Stripe brengt kosten per transactie in rekening, afhankelijk van de betaalmethode die door de eindklant wordt gebruikt. Kijk hier voor meer informatie over de kosten per betaalmethode."}},{"@type":"Question","name":"Moet ik belasting betalen?","acceptedAnswer":{"@type":"Answer","text":"Stripe moet voor bepaalde producten en diensten belasting in rekening brengen. Op basis van je locatie en/of je onderneming/belastingstatus wordt bepaald of voor het product of de dienst belasting moet worden betaald en welk belastingtarief van toepassing is.\n\nMeer informatie"}},{"@type":"Question","name":"Zijn er extra kosten voor terugbetalingen?","acceptedAnswer":{"@type":"Answer","text":"- Voor ondernemingen met standaardtarieven: er kunnen kosten voor terugbetalingen in rekening worden gebracht bij gebruik van bankoverschrijvingen. Voor alle andere betaalmethoden zijn er geen kosten voor terugbetalingen. De kosten voor betalingsverwerking, Connect en valuta omwisselen die zijn gemaakt bij de oorspronkelijke transactie, krijg je niet terug.\n- Voor ondernemingen met tarieven op maat: afhankelijk van het tariefschema dat je met Stripe hebt afgesproken, kunnen er kosten in rekening worden gebracht voor terugbetalingen."}},{"@type":"Question","name":"Moet ik opstartkosten of maandelijkse kosten betalen?","acceptedAnswer":{"@type":"Answer","text":"Stripe brengt geen opstartkosten of maandelijkse kosten in rekening, en er zijn geen verborgen kosten voor bijvoorbeeld het sluiten van een account. Op onze website vind je alle kosten voor ondernemingen met standaardtarieven."}},{"@type":"Question","name":"Kan ik korting krijgen?","acceptedAnswer":{"@type":"Answer","text":"Stripe biedt tarieven op maat voor ondernemingen met grote betaalvolumes. Wie hiervoor in aanmerking komt, verschilt per markt."}}]}</script>
