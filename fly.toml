app = "heli-app"
primary_region = "ams"

[build]

[env]
PORT = "3000"
ORIGIN = "https://heli.so"
NODE_ENV = "production"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
