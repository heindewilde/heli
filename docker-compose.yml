services:
  heli:
    # Default: pull the published image. To build from source (e.g. when
    # iterating on a fork), run `docker compose up -d --build`.
    image: ghcr.io/heindewilde/heli:latest
    build: .
    container_name: heli
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_PATH: /data/heli.db
      AVATARS_DIR: /data/avatars
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Watches the registry and rolls Heli to the latest image automatically.
  # Scoped via the label above so it never touches anything else on the host.
  # Disable by commenting this service out and running `docker compose up -d`.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: heli-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 21600
    environment:
      TZ: UTC
      # Recent Docker daemons reject Watchtower's default client API version.
      # Pin to a version both sides understand.
      DOCKER_API_VERSION: "1.45"
