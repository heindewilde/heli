services:
  heli:
    build: .
    container_name: heli
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_PATH: /data/heli.db
      AVATARS_DIR: /data/avatars
